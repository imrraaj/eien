name: eien

# Self-hosted Temporal (Postgres) + the app database.
# Only Postgres init differs from the official temporalio/docker-compose setup:
# we also create the `agent` database/role used by the app.

x-temporal-postgres-env: &temporal-postgres-env
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-temporal}
  POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
  POSTGRES_SEEDS: postgresql

services:
  postgresql:
    image: postgres:${POSTGRESQL_VERSION:-16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
      # Consumed by docker/initdb/01-create-agent-db.sh
      AGENT_DB_NAME: ${AGENT_DB_NAME:-agent}
      AGENT_DB_USER: ${AGENT_DB_USER:-agent}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-agent}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - temporal-network

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.1}
    restart: unless-stopped
    environment:
      <<: *temporal-postgres-env
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./docker/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - temporal-network

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      - temporal
    stdin_open: true
    tty: true
    networks:
      - temporal-network

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    depends_on:
      - temporal
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - temporal-network

volumes:
  postgres-data:

networks:
  temporal-network:
    driver: bridge
