# Gateway + sandbox container. The gateway talks to the sandbox over SSH, so no
# Docker socket is exposed to either service and no ports are published.
#
# Run through deploy/setup.sh, which generates deploy/keys and writes
# deploy/compose.env, then:
#   docker compose --env-file deploy/compose.env -f docker-compose.bot.yml up -d
#
# On a host with KVM you can instead run the gateway locally (`bun run bot`) and
# keep using Docker Sandboxes; SANDBOX_DRIVER defaults to "sbx" there.
name: eien-bot

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: eien/gateway:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    depends_on:
      sandbox:
        condition: service_healthy
    environment:
      STATE_DIR: /data
      HOME: /tmp/home
      SANDBOX_DRIVER: ssh
      SANDBOX_SSH_HOST: sandbox
      SANDBOX_SSH_USER: agent
      SANDBOX_SSH_PORT: "22"
      SANDBOX_SSH_KEY: /keys/id_ed25519
      SANDBOX_SSH_KNOWN_HOSTS: /keys/known_hosts
      SBX_NAME: sandbox
      SBX_WORKDIR: /work
    # The client key is 0600 on the host; run as the same user so it stays
    # readable without loosening permissions.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Durable conversations, schedules, and the chat map. Reuses ./state
      # from host-side runs.
      - ./state:/data
      - ./deploy/keys/id_ed25519:/keys/id_ed25519:ro
      - ./deploy/keys/known_hosts:/keys/known_hosts:ro
    extra_hosts:
      # For a model server on the host, set LLM_BASE_URL=http://host.docker.internal:9931/v1
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: eien/sandbox:local
    container_name: eien-sandbox
    restart: unless-stopped
    init: true
    volumes:
      - sandbox-work:/work
      - ./deploy/keys/id_ed25519.pub:/home/agent/.ssh/authorized_keys:ro
      - ./deploy/keys/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./deploy/keys/ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 2 -p 22 127.0.0.1 2>/dev/null | grep -q ssh-ed25519"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s

volumes:
  sandbox-work:
